      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/portrait.jpg" fetchpriority="high" />

    <script>
      // Applique le thème mémorisé avant le premier rendu : évite le flash clair.
      try {
        var stored = localStorage.getItem('nb-theme');
        var dark = stored
          ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        if (dark) {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0e0d14');
        }
      } catch (e) {
        /* stockage bloqué : le thème système s'applique via les media queries */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
